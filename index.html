<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うらめしの部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0908;
    --ink-soft:#1A1210;
    --red:#C8291F;
    --red-bright:#E24B42;
    --text:#F5EEE6;
    --text-dim:#C9BDB3;
    --font-display: 'Shippori Mincho', serif;
    --font-body: 'Zen Kaku Gothic New', sans-serif;
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--ink);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(45deg, rgba(226,75,66,0.16) 25%, transparent 25%, transparent 75%, rgba(226,75,66,0.16) 75%),
      linear-gradient(45deg, rgba(226,75,66,0.16) 25%, transparent 25%, transparent 75%, rgba(226,75,66,0.16) 75%);
    background-size:28px 28px;
    background-position:0 0, 14px 14px;
  }
  .app{max-width:640px;margin:0 auto;padding:0 0 60px;min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  header.site{padding:44px 28px 30px;text-align:center;}
  .avatar{
    width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 18px;display:block;
    border:2px solid var(--red-bright);
    box-shadow:0 0 0 5px var(--ink), 0 0 0 6px rgba(226,75,66,0.55);
  }
  .site-eyebrow{font-size:11px;letter-spacing:0.35em;color:var(--red-bright);margin-bottom:12px;}
  h1.site-title{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,7vw,40px);margin:0 0 12px;line-height:1.4;}
  p.site-subtitle{color:var(--text-dim);font-size:14px;line-height:1.9;margin:0;white-space:pre-wrap;}

  nav.shelf{padding:8px 20px 0;background:rgba(10,9,8,0.35);}
  .shelf-item{display:flex;align-items:center;gap:16px;padding:20px 8px;border-bottom:1px solid rgba(226,75,66,0.28);}
  .shelf-icon{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--red-bright);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:var(--red-bright);font-size:15px;
    background:rgba(10,9,8,0.6);
  }
  .shelf-info{flex:1;min-width:0;}
  .shelf-name{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:4px;}
  .shelf-count{font-size:12px;color:var(--text-dim);}
  .shelf-arrow{color:var(--red-bright);font-size:18px;flex-shrink:0;}

  .category-header{padding:36px 28px 20px;display:flex;align-items:center;gap:14px;background:rgba(10,9,8,0.35);border-bottom:1px solid rgba(226,75,66,0.4);}
  .back-btn{background:none;border:1px solid rgba(245,238,230,0.3);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
  h2.category-title{font-family:var(--font-display);font-size:24px;margin:0;}

  .list-item{background:rgba(10,9,8,0.55);padding:20px 24px;border-bottom:1px solid rgba(226,75,66,0.22);}
  .list-item .name{font-family:var(--font-display);font-weight:700;font-size:16px;margin-bottom:6px;}
  .list-item .desc{font-size:13px;color:var(--text-dim);line-height:1.7;margin-bottom:10px;}
  .list-item .link{font-size:13px;color:var(--red-bright);letter-spacing:0.03em;}

  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(226,75,66,0.2);margin-top:1px;}
  .product-card{background:var(--ink);padding:18px 16px 20px;display:flex;flex-direction:column;gap:10px;}
  .product-photo{width:100%;aspect-ratio:1/1;background:var(--ink-soft);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(226,75,66,0.3);}
  .product-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-name{font-size:14px;font-weight:700;line-height:1.5;}
  .product-desc{font-size:12px;color:var(--text-dim);line-height:1.7;flex:1;}
  .product-link{margin-top:4px;font-size:12px;letter-spacing:0.05em;color:var(--red-bright);border-top:1px solid rgba(226,75,66,0.35);padding-top:10px;}

  .empty-note{padding:60px 28px;text-align:center;color:var(--text-dim);font-size:13px;line-height:2;background:rgba(10,9,8,0.35);}
  footer.site-footer{text-align:center;padding:40px 20px 0;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;}

  [data-view="category"] .home-only{display:none;}
  [data-view="home"] .category-only{display:none;}
</style>
</head>

  const DATA = {
    title: "うらめしの部屋",
    subtitle: "TikTokのフォローお願いします！LINEスタンプも出してます。\n実際に使ってるアイテムやおすすめの商品も紹介してるので、良かったら覗いてみてください。",
    categories: [
      {
        id: "tiktok", name: "TikTok", icon: "TT", layout: "list", linkLabel: "TikTokを見る",
        products: [
          { name: "本アカウント「うらめし」", desc: "荒野行動の動画、配信を主にしてます", url: "https://www.tiktok.com/@sukeyu555?_r=1&_t=ZS-99qiJRFQb3w" },
          { name: "サブアカウント「うらちゃん」", desc: "日頃の動画、雑談配信、カラオケ配信を主にしてます", url: "https://www.tiktok.com/@ura_sbu?_r=1&_t=ZS-99qiQYeF3e4" }

      {

        products: [
          { name: "うらめしスタンプ①", desc: "何でも使える♪うらめしスタンプ①", url: "https://line.me/S/sticker/26281504/?lang=ja&utm_source=gnsh_stickerDetail" },

        ]
      },
      { id: "car", name: "車で使える便利グッズ", icon: "車", layout: "grid", linkLabel: "Amazonで見る", products: [] },
      { id: "game", name: "ゲームで使えるグッズ", icon: "ゲ", layout: "grid", linkLabel: "Amazonで見る", products: [] },
      { id: "gear", name: "実際に使ってる配信機材", icon: "機", layout: "grid", linkLabel: "Amazonで見る", products: [] },
      { id: "cosme", name: "おすすめ化粧品", icon: "美", layout: "grid", linkLabel: "Amazonで見る", products: [] }
    ]
  };

  function esc(s){
    return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function getCatFromHash(){
    const h = location.hash.replace("#","");
    return DATA.categories.find(c=>c.id===h) || null;
  }

  function render(){
    const app = document.getElementById("app");
    const cat = getCatFromHash();
    app.dataset.view = cat ? "category" : "home";

    let html = `<header class="site">
      <img class="avatar" src="${AVATAR_SRC}" alt="うらめし">
      <div class="site-eyebrow">URAMESHI ROOM</div>
      <h1 class="site-title">${esc(DATA.title)}</h1>
      <p class="site-subtitle">${esc(DATA.subtitle)}</p>
    </header>`;

    if(!cat){
      html += `<nav class="shelf">`;
      DATA.categories.forEach(c=>{
        html += `<a class="shelf-item" href="#${c.id}">
          <div class="shelf-icon">${esc(c.icon||"★")}</div>
          <div class="shelf-info">
            <div class="shelf-name">${esc(c.name)}</div>
            <div class="shelf-count">${c.products.length}件</div>
          </div>
          <div class="shelf-arrow">›</div>
        </a>`;
      });
      html += `</nav>`;
    } else {
      html += `<div class="category-header">
        <a class="back-btn" href="#">‹</a>
        <h2 class="category-title">${esc(cat.name)}</h2>
      </div>`;
      if(cat.products.length === 0){
        html += `<div class="empty-note">まだ登録されていません。近日追加予定です。</div>`;
      } else if(cat.layout === "list"){
        cat.products.forEach(p=>{
          html += `<div class="list-item">
            <div class="name">${esc(p.name)}</div>
            <div class="desc">${esc(p.desc)}</div>
            <a class="link" href="${esc(p.url||'#')}" target="_blank" rel="noopener">${esc(cat.linkLabel||"見る")} ›</a>
          </div>`;
        });
      } else {
        html += `<div class="product-grid">`;
        cat.products.forEach(p=>{
          html += `<div class="product-card">
            <div class="product-photo">${p.image ? `<img src="${p.image}" alt="${esc(p.name)}">` : ""}</div>
            <div class="product-name">${esc(p.name)}</div>
            <div class="product-desc">${esc(p.desc)}</div>
            <a class="product-link" href="${esc(p.url||'#')}" target="_blank" rel="noopener">${esc(cat.linkLabel||"見る")} ›</a>
          </div>`;
        });
        html += `</div>`;
      }
    }
    html += `<footer class="site-footer">${esc(DATA.title)}</footer>`;
    app.innerHTML = html;
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
